name: Deploy Documentation

on:
  push:
    branches:
      - dev
    # The site is generated from more than docs/: the API reference comes from
    # every module's main sources, the railroad diagrams from the grammar, and
    # the schema page from a compiler resource. So this is a deny list, not an
    # allow list — anything not named here still deploys. Listing what the site
    # is built from instead would publish a stale site the day someone adds a
    # new input and forgets this file.
    paths-ignore:
      - '**/src/test/**'
      - 'examples/**'
      - 'scripts/**'
      - 'debian/**'
      - 'bin/**'
      - 'config/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/sonar.yml'
      - '.github/workflows/release.yml'
      - '.gitignore'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'CITATION.cff'
      - 'LICENSE'
      - 'code-of-conduct.md'
  # A change to the site's toolchain is built, not deployed, in its pull
  # request: a lock that cannot be installed (no wheel for a new version, a
  # requirements.in edited without recompiling it) fails there rather than
  # in the first deploy after the merge (#208).
  pull_request:
    paths:
      - 'docs/requirements.in'
      - 'docs/requirements.txt'
      - 'mkdocs.yml'
      - 'jpipe-lang/gen_railroad.py'
      - '.github/workflows/docs.yml'

# Pull requests from Dependabot and from forks get a read-only token anyway.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Install PlantUML
        # Refresh the index first: the runner image's copy goes stale, and apt
        # then asks the mirror for package versions it no longer serves.
        run: sudo apt-get update -y && sudo apt-get install -y plantuml

      - name: Install the site's Python tools
        # Locked by version and hash, and wheels only: a source distribution
        # would run its build code here, with a token that can push (#208).
        run: |
          pip install --require-hashes --only-binary :all: -r docs/requirements.txt

      - name: Generate railroad diagrams
        run: python3 jpipe-lang/gen_railroad.py

      - name: Generate Javadoc
        run: mvn javadoc:aggregate -q

      - name: Copy Javadoc into docs
        run: cp -r target/reports/apidocs docs/api

      - name: Copy the diagnostic report JSON Schema into docs
        # The schema is a packaged compiler resource; it is staged here so the
        # site serves it at the $id URL declared inside the file. Copied rather
        # than duplicated in git, so there is only ever one source of truth.
        run: |
          mkdir -p docs/schema
          cp jpipe-compiler/src/main/resources/schema/*.json docs/schema/

      - name: Prepare docs index from README
        run: |
          # The README is read from the repository root on GitHub and from
          # docs/ on the site, so docs-relative paths have to be re-anchored.
          sed \
            -e 's|\./docs/logo\.svg|logo.svg|g' \
            -e 's|\./docs/sponsors/|sponsors/|g' \
            -e 's|](docs/|](|g' \
            -e 's|^  - |    - |g' \
            README.md > docs/index.md

      - name: Build the site
        if: github.event_name == 'pull_request'
        run: mkdocs build

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        run: mkdocs gh-deploy --force
