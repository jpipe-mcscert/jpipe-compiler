name: Build

on:
  # Topic branches are built through `pull_request`, which builds the merge
  # result rather than the branch tip. Listing them here as well would run
  # every build twice, and a bare `push:` would also rebuild release tags that
  # release.yml already verifies.
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

# A new push supersedes the run it interrupts, but only for pull requests --
# builds of main and dev always run to completion.
#
# Keyed on the pull request *number* rather than the branch name: two pull
# requests can carry the same head_ref (`patch-1` from two different forks),
# and sharing a group would let one cancel the other's build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Extract Maven version
        id: mvn_version
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          [ -n "$VERSION" ] || { echo "ERROR: could not extract project version" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # `verify`, not `package`: the shaded-JAR smoke tests (jpipe-cli's *IT)
      # run after packaging, and only this phase reaches them. It also brings
      # spotless, checkstyle and coverage into this job.
      - name: Build and test
        run: mvn -B verify

      # Locate the shaded fat JAR (exclude the *-original.jar that Shade leaves behind)
      - name: Locate fat JAR
        id: locate
        run: |
          JAR=$(find jpipe-cli/target -name "jpipe-cli-*.jar" ! -name "*-original.jar" -type f)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      # Contract with jpipe-runner (#165): the step libraries `-f PYTHON`
      # writes must import on the runner they target, and a dry run must refuse
      # them only for what a skeleton cannot know. A change on either side that
      # breaks the generated code fails here, not for a user.
      #
      # The runner and the compiler co-evolve, so the runner is trusted and
      # deliberately not pinned: each build checks against the latest release
      # the exporter targets (>= 4.0; jPipe 2.5.0 and earlier target < 4.0).
      # Wheels only, so no package's setup script runs here. Sonar's
      # unpinned-dependency rule is excluded for this file in pom.xml.
      - name: Set up Python for the runner contract
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check generated step libraries against jpipe-runner 4
        run: |
          python -m pip install --quiet --only-binary :all: 'jpipe-runner>=4.0'
          scripts/runner-contract.sh "${{ steps.locate.outputs.path }}"

      # Always upload the fat JAR as a per-run artifact (available on the Actions run page)
      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: jpipe-cli-${{ steps.mvn_version.outputs.version }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
