name: Build

on:
  # Topic branches are built through `pull_request`, which builds the merge
  # result rather than the branch tip. Listing them here as well would run
  # every build twice, and a bare `push:` would also rebuild release tags that
  # release.yml already verifies.
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

# A new push supersedes the run it interrupts, but only for pull requests --
# builds of main and dev always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Extract Maven version
        id: mvn_version
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          [ -n "$VERSION" ] || { echo "ERROR: could not extract project version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: mvn -B package

      # Locate the shaded fat JAR (exclude the *-original.jar that Shade leaves behind)
      - name: Locate fat JAR
        id: locate
        run: |
          JAR=$(find jpipe-cli/target -name "jpipe-cli-*.jar" ! -name "*-original.jar" -type f)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      # Always upload the fat JAR as a per-run artifact (available on the Actions run page)
      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: jpipe-cli-${{ steps.mvn_version.outputs.version }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
