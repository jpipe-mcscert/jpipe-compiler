name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.sha256.outputs.sha256 }}
      sha256_zip: ${{ steps.sha256_zip.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v7

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "ERROR: tag must point to a commit on main"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches pom.xml version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          POM_VER=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          POM_VER="${POM_VER%-SNAPSHOT}"
          TAG_BASE="${VERSION%%-*}"
          if [ "$TAG_BASE" != "$POM_VER" ]; then
            echo "ERROR: tag v$VERSION (base: $TAG_BASE) does not match pom.xml version (expected $POM_VER)"
            exit 1
          fi

      - name: Set release version in pom.xml
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build fat JAR
        run: mvn -B verify

      - name: Locate fat JAR
        id: locate
        run: |
          JAR=$(find jpipe-cli/target -name "jpipe-cli-*.jar" ! -name "*-original.jar" -type f)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Assemble Homebrew tarball
        id: tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/jpipe-$VERSION
          cp "${{ steps.locate.outputs.path }}" dist/jpipe-$VERSION/jpipe.jar
          cp bin/jpipe dist/jpipe-$VERSION/jpipe
          cp bin/aot-training.jd dist/jpipe-$VERSION/aot-training.jd
          tar -czf dist/jpipe-$VERSION.tar.gz -C dist jpipe-$VERSION
          echo "path=dist/jpipe-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: sha256
        run: |
          SHA=$(sha256sum "${{ steps.tarball.outputs.path }}" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Assemble Scoop zip
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/scoop
          cp "${{ steps.locate.outputs.path }}" dist/scoop/jpipe.jar
          cp bin/jpipe.ps1 dist/scoop/jpipe.ps1
          cp bin/aot-training.jd dist/scoop/aot-training.jd
          (cd dist/scoop && zip -qr "../jpipe-$VERSION.zip" .)
          echo "path=dist/jpipe-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256 (zip)
        id: sha256_zip
        run: |
          SHA=$(sha256sum "${{ steps.zip.outputs.path }}" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE_FLAG=""
          [[ "$VERSION" == *-* ]] && PRERELEASE_FLAG="--prerelease"
          gh release create "v$VERSION" \
            --title "jPipe v$VERSION" \
            --generate-notes \
            $PRERELEASE_FLAG \
            "${{ steps.tarball.outputs.path }}" \
            "${{ steps.zip.outputs.path }}" \
            "${{ steps.locate.outputs.path }}"

  update-homebrew:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    needs: build-and-release
    if: ${{ !contains(needs.build-and-release.outputs.version, '-') }}

    steps:
      - name: Checkout the tagged sources
        uses: actions/checkout@v7
        with:
          path: source

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: jpipe-mcscert/homebrew-mcscert
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update Homebrew formulas
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          SHA256="${{ needs.build-and-release.outputs.sha256 }}"
          URL="https://github.com/jpipe-mcscert/jpipe-compiler/releases/download/v${VERSION}/jpipe-${VERSION}.tar.gz"

          # The whole formula comes from the template in packaging/homebrew:
          # the tap is never edited by hand (ADR-0025).
          sed -e "s|@@URL@@|${URL}|" -e "s|@@SHA256@@|${SHA256}|" \
            source/packaging/homebrew/jpipe.rb > tap/jpipe.rb
          # @@PREFIX@@ and @@JAVA@@ stay: the formula fills them in at install.
          if grep -q -e '@@URL@@' -e '@@SHA256@@' tap/jpipe.rb; then
            echo "ERROR: release placeholder left in jpipe.rb" >&2
            exit 1
          fi

          # Create versioned formula jpipe@X.Y.Z.rb (e.g. 2.1.0 → JpipeAT210)
          AT_VERSION=$(echo "$VERSION" | tr -d '.')
          sed "s|class Jpipe <|class JpipeAT${AT_VERSION} <|" tap/jpipe.rb \
            > "tap/jpipe@${VERSION}.rb"

      - name: Commit and push
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "jpipe.rb" "jpipe@${VERSION}.rb"
          # A re-run after a partial failure finds the tap already up to date.
          if git diff --cached --quiet; then
            echo "The tap already holds jpipe v${VERSION}"
            exit 0
          fi
          git commit -m "chore: bump jpipe to v${VERSION}"
          git push

  update-scoop:
    name: Update Scoop manifest
    runs-on: ubuntu-latest
    needs: build-and-release
    if: ${{ !contains(needs.build-and-release.outputs.version, '-') }}

    steps:
      - name: Checkout the tagged sources
        uses: actions/checkout@v7
        with:
          path: source

      - name: Checkout Scoop bucket
        uses: actions/checkout@v7
        with:
          repository: jpipe-mcscert/scoop-mcscert
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Update Scoop manifest
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          SHA256="${{ needs.build-and-release.outputs.sha256_zip }}"
          URL="https://github.com/jpipe-mcscert/jpipe-compiler/releases/download/v${VERSION}/jpipe-${VERSION}.zip"

          # The whole manifest and the bucket's README come from the templates
          # in packaging/scoop: the bucket is never edited by hand (ADR-0025).
          jq --indent 4 --arg v "$VERSION" --arg u "$URL" --arg h "$SHA256" \
             '.version = $v | .url = $u | .hash = $h' \
             source/packaging/scoop/jpipe.json > scoop-bucket/bucket/jpipe.json
          cp source/packaging/scoop/README.md scoop-bucket/README.md

      - name: Commit and push
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/jpipe.json README.md
          # A re-run after a partial failure finds the bucket already up to
          # date. Each release stays one commit: Scoop 0.6.0 and later install
          # an older version from the commit that holds it.
          if git diff --cached --quiet; then
            echo "The bucket already holds jpipe v${VERSION}"
            exit 0
          fi
          git commit -m "chore: bump jpipe to v${VERSION}"
          git push

  publish-ppa:
    name: Publish to Ubuntu PPA (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: build-and-release
    if: ${{ !contains(needs.build-and-release.outputs.version, '-') }}
    strategy:
      matrix:
        distro: [noble, resolute, stonking]

    steps:
      - uses: actions/checkout@v7

      - name: Install Debian packaging tools
        run: sudo apt-get update -y && sudo apt-get install -y devscripts debhelper dput gnupg

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT=$(gpg --with-colons --fingerprint "$GPG_KEY_ID" | awk -F: '/^fpr:/{print $10; exit}')
          echo "${FINGERPRINT}:6:" | gpg --import-ownertrust
          echo "GPG_FINGERPRINT=${FINGERPRINT}" >> "$GITHUB_ENV"
          # Configure agent for non-interactive signing and pre-cache the passphrase
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye
          echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --sign --output /dev/null /dev/null

      - name: Download fat JAR from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          gh release download "v${VERSION}" \
            --pattern "jpipe-cli-${VERSION}.jar" \
            --output jpipe.jar

      - name: Generate debian/changelog for this release
        env:
          DEBEMAIL: mossers@mcmaster.ca
          DEBFULLNAME: jPipe Team
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          dch --newversion "${VERSION}~${{ matrix.distro }}1" \
              --distribution ${{ matrix.distro }} \
              --force-distribution \
              "Release v${VERSION}."

      - name: Build Debian source package
        env:
          DEBEMAIL: mossers@mcmaster.ca
          DEBFULLNAME: jPipe Team
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          dpkg-buildpackage -S -d --sign-key="$GPG_FINGERPRINT"

      - name: Upload to Launchpad PPA
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          dput ppa:mcscert/ppa "../jpipe_${VERSION}~${{ matrix.distro }}1_source.changes"
