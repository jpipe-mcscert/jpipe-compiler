# Dependency freshness (ADR-0007, after jpipe-vscode ADR-VSC-0013 and jpipe-runner ADR-0026):
# weekly, against `dev` (the repository's default branch, ADR-0024), in ONE pull request.
#
# Every entry joins the `weekly` multi-ecosystem group, so a week's Maven, pip and GitHub
# Actions updates arrive together, majors included: one branch per round of updates, verified
# as a whole. A major that needs a migration has it on that pull request's branch, or gets a
# hold below if it cannot happen that week.
#
# A MAJOR IS HELD ENTIRELY only where it is more than a bump, and the reason is written next to
# the hold.
#
# Pre-releases need no rule here. While the current version is stable, Dependabot drops every
# version whose Maven qualifier is alpha/aN, beta/bN, milestone/mN, rc, cr or snapshot, and every
# action tag that has a qualifier or is flagged a pre-release on GitHub. Checked on 2026-11-11
# against the full history of each artifact declared here: all 170 qualified versions are
# caught. A qualifier outside that list (`-preview`, `-ea`, …) would pass as a release, so a new
# dependency that uses one needs an `ignore` entry.
#
# Every entry sets `labels:`, as the group does. Left unset, Dependabot adds a per-ecosystem label
# (`java`, `github_actions`, `python`) next to `dependencies` whenever a file declares several
# ecosystems, and creates it in the repository. Setting `labels:` replaces the defaults, so
# `dependencies` is listed too, and `area: build` files the pull request under the repository's
# label scheme. A group's labels are added to its entries' labels.

version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "area: build"]

updates:

  # ---------------------------------------------------------------- maven
  # Every version lives in a <properties> entry of the root pom; Dependabot edits the property.
  - package-ecosystem: maven
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    labels: ["dependencies", "area: build"]

    ignore:
      # ANTLR's major changes the generated parser and the grammar's target runtime: it is a
      # migration of jpipe-lang, not a version bump.
      - dependency-name: "org.antlr:*"
        update-types: ["version-update:semver-major"]
      # Log4j 3 changes the configuration format and the plugin model that the shade
      # transformer in jpipe-cli rebuilds; only the fat-JAR smoke tests would notice.
      - dependency-name: "org.apache.logging.log4j:log4j-api"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.logging.log4j:log4j-core"
        update-types: ["version-update:semver-major"]
      # Pinned only because Cucumber declares them as version ranges (#207, see
      # `cucumber.version` in the pom). For each of them, the narrowest range Cucumber's own
      # artifacts declare stops below the next major, so a major here would leave the range
      # Cucumber was built against. They move to a new major by hand, with the Cucumber update
      # that widens those ranges; build.yml fails on a pin outside a declared range.
      - dependency-name: "org.jspecify:jspecify"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.cucumber:messages"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.cucumber:query"
        update-types: ["version-update:semver-major"]

  # ------------------------------------------------------------------ pip
  # The documentation site's Python tools: docs/requirements.in names them, and
  # docs/requirements.txt, compiled by pip-compile, locks them by hash (#208). Dependabot
  # recompiles the lock. CI only; nothing here reaches the compiler or its JAR.
  - package-ecosystem: pip
    directory: /docs
    multi-ecosystem-group: weekly
    patterns: ["*"]
    labels: ["dependencies", "area: build"]

  # -------------------------------------------------------- github-actions
  # Pinned by major tag, so every update here is a major: a tag move such as `@v5` → `@v6`,
  # mostly a runtime move (Node, ESM).
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    labels: ["dependencies", "area: build"]
